openapi: 3.0.3
info:
  title: Petstore
  version: 1.0.0
  description: The example spec used by MockLoom's docs and tests.
tags:
  - name: pets
  - name: store
paths:
  /pets:
    get:
      tags: [pets]
      summary: List pets
      operationId: listPets
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: status
          in: query
          schema: { type: string, enum: [available, pending, sold, empty] }
      responses:
        "200":
          description: A page of pets
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Pet" }
                  total: { type: integer, minimum: 0 }
    post:
      tags: [pets]
      summary: Create a pet
      operationId: createPet
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewPet" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pet" }
        "400":
          description: Invalid pet
  /pets/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [pets]
      summary: Get a pet
      operationId: getPet
      responses:
        "200":
          description: One pet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pet" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [pets]
      summary: Delete a pet
      operationId: deletePet
      responses:
        "204":
          description: Deleted
  /pets/mine:
    get:
      tags: [pets]
      summary: Pets owned by the current user
      operationId: myPets
      responses:
        "200":
          description: My pets
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Pet" }
  /store/inventory:
    get:
      tags: [store]
      summary: Stock by status
      operationId: inventory
      responses:
        "200":
          description: Stock counts
          content:
            application/json:
              schema:
                type: object
                additionalProperties: { type: integer, minimum: 0 }
              example: { available: 12, pending: 3, sold: 40 }
components:
  schemas:
    NewPet:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        tag: { type: string, nullable: true }
        price: { type: number, minimum: 0 }
    Pet:
      allOf:
        - $ref: "#/components/schemas/NewPet"
        - type: object
          required: [id, status]
          properties:
            id: { type: integer, format: int64, readOnly: true }
            status: { type: string, enum: [available, pending, sold] }
            ownerEmail: { type: string, format: email }
            createdAt: { type: string, format: date-time }
            friends:
              type: array
              maxItems: 2
              items: { $ref: "#/components/schemas/Pet" }
    Error:
      type: object
      required: [message]
      properties:
        code: { type: integer }
        message: { type: string }
