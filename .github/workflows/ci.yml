name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: mockloom
          POSTGRES_DB: mockloom_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MOCKLOOM_TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://postgres:mockloom@localhost:5432/mockloom_test' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: "**/pyproject.toml"
      - run: pip install --upgrade pip
      - run: pip install -e packages/engine -e "apps/api[dev,postgres]" pip-audit
      - run: ruff check .
      - run: pip-audit --skip-editable
      - name: Rule schema is current
        run: python scripts/export_rule_schema.py && git diff --exit-code packages/engine/rule.schema.json
      - name: TypeScript contract is current
        run: python scripts/export_openapi.py && git diff --exit-code apps/web/src/api/openapi.json
      - run: pytest packages/engine/tests apps/api/tests

  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: "**/pyproject.toml"
      - uses: actions/cache@v4
        with:
          path: tests/corpus/specs
          key: corpus-${{ hashFiles('tests/corpus/manifest.json') }}
      - run: pip install -e packages/engine pytest
      - run: python scripts/fetch_corpus.py
      - run: pytest tests/test_corpus.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - name: Generated client is current
        run: npm run gen:api && git diff --exit-code src/api/schema.d.ts
      - run: npm run build
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python -m venv .venv && .venv/bin/pip install -e packages/engine -e apps/api
      - run: npm ci && npm run build && npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run e2e
        working-directory: apps/web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results

  image:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t mockloom:ci .
      - name: Serve an example from the image
        run: |
          docker run -d --name mockloom -p 127.0.0.1:8000:8000 mockloom:ci
          timeout 60 sh -c 'until curl -sf http://127.0.0.1:8000/api/workspaces >/dev/null; do sleep 1; done'
          python3 -c "import json; print(json.dumps({'name': 'Tasks', 'slug': 'tasks', 'spec_text': open('examples/specs/task-tracker.yaml').read()}))" \
            | curl -sf -X POST http://127.0.0.1:8000/api/workspaces -H 'content-type: application/json' -d @-
          curl -sf http://127.0.0.1:8000/mock/tasks/tasks
          curl -sf http://127.0.0.1:8000/ | grep -q '<div id="root">'

