[project]
name = "mockforge-api"
version = "0.1.0"
description = "The MockForge server: management API, mock endpoint and live request log."
requires-python = ">=3.11"
dependencies = [
  "mockforge-engine",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "httpx>=0.27", "schemathesis>=3.30", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mockforge_api"]
